<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lyric-to-MIDI Melody Generator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, textarea, input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .results {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .results.active {
      display: flex;
    }

    .midi-visualizer {
      height: 120px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 1rem;
    }

    .note-bar {
      width: 8%;
      background: linear-gradient(180deg, #818cf8 0%, var(--accent) 100%);
      border-radius: 4px;
      transition: height 0.3s ease;
    }

    .audio-player-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    audio {
      width: 100%;
      border-radius: 6px;
    }

    .download-group {
      display: flex;
      gap: 1rem;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      text-align: center;
      line-height: 1.5;
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background-color: #10b98120;
      color: #10b981;
      border: 1px solid #10b98140;
      width: fit-content;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Lyric-to-MIDI Generator</h1>
      <p>On-Device AI Pitch & Rhythm Synthesis Engine</p>
    </header>

    <div class="card">
      <div class="status-badge">⚡ Lightweight Model Loaded (On-Device)</div>
      
      <div class="controls-grid">
        <div class="form-group">
          <label for="scale">Target Scale</label>
          <select id="scale">
            <option value="major">C Major Scale</option>
            <option value="minor">A Minor Scale</option>
            <option value="pentatonic">Major Pentatonic</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo">Tempo (BPM)</label>
          <input type="number" id="tempo" value="120" min="60" max="200">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="lyrics">Enter Lyrics</label>
        <textarea id="lyrics" placeholder="Type your lyrics here...&#10;e.g., Walking through the rain late at night">Walking through the rain late at night</textarea>
      </div>

      <button class="btn" id="generate-btn" onclick="generateMelody()">Generate MIDI & Audio</button>
    </div>

    <div class="card results" id="results-card">
      <h3>Generated Melody Output</h3>
      
      <div class="form-group">
        <label>Piano Roll Preview</label>
        <div class="midi-visualizer" id="visualizer"></div>
      </div>

      <div class="audio-player-container">
        <label>Synthesized Audio Preview (.WAV)</label>
        <audio controls id="audio-player"></audio>
      </div>

      <div class="download-group">
        <a id="midi-download" class="btn btn-secondary" href="#" download="melody.mid">Download MIDI (.mid)</a>
        <a id="wav-download" class="btn btn-secondary" href="#" download="vocal_guide.wav">Download WAV (.wav)</a>
      </div>
    </div>
  </div>

  <script>
    // Scale frequencies (Hz) mapping to pitch note values
    const SCALES = {
      major: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25], // C Major
      minor: [220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00], // A Minor
      pentatonic: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25] // Pentatonic
    };

    const MIDI_NOTES = {
      major: [60, 62, 64, 65, 67, 69, 71, 72],
      minor: [57, 59, 60, 62, 64, 65, 67, 69],
      pentatonic: [60, 62, 64, 67, 69, 72]
    };

    function generateMelody() {
      const lyrics = document.getElementById('lyrics').value.trim();
      const scaleType = document.getElementById('scale').value;
      const bpm = parseInt(document.getElementById('tempo').value) || 120;
      const btn = document.getElementById('generate-btn');
      const resultsCard = document.getElementById('results-card');

      if (!lyrics) {
        alert('Please enter some lyrics first.');
        return;
      }

      btn.textContent = 'Processing & Synthesizing...';
      btn.disabled = true;

      setTimeout(() => {
        // Simple syllabification logic (splits words into chunks)
        const words = lyrics.split(/\s+/);
        const notesFreq = [];
        const notesMidi = [];
        const scale = SCALES[scaleType];
        const midiScale = MIDI_NOTES[scaleType];

        words.forEach((word, index) => {
          const syllables = word.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi) || [word];
          syllables.forEach((syl, sylIdx) => {
            const pitchIndex = (word.length + sylIdx + index * 2) % scale.length;
            notesFreq.push(scale[pitchIndex]);
            notesMidi.push(midiScale[pitchIndex]);
          });
        });

        // Update Visualizer UI
        const visualizer = document.getElementById('visualizer');
        visualizer.innerHTML = '';
        notesFreq.forEach(freq => {
          const bar = document.createElement('div');
          bar.className = 'note-bar';
          const heightPercent = Math.min(100, Math.max(20, (freq / 550) * 100));
          bar.style.height = `${heightPercent}%`;
          visualizer.appendChild(bar);
        });

        // Synthesize WAV audio in memory
        const wavBlob = createWavAudioBlob(notesFreq, bpm);
        const wavUrl = URL.createObjectURL(wavBlob);

        const audioPlayer = document.getElementById('audio-player');
        audioPlayer.src = wavUrl;

        document.getElementById('wav-download').href = wavUrl;

        // Generate MIDI Blob
        const midiBlob = createMidiFileBlob(notesMidi, bpm);
        document.getElementById('midi-download').href = URL.createObjectURL(midiBlob);

        btn.textContent = 'Generate MIDI & Audio';
        btn.disabled = false;
        resultsCard.classList.add('active');
        resultsCard.scrollIntoView({ behavior: 'smooth' });
      }, 500);
    }

    // Helper: Create functional WAV file in browser
    function createWavAudioBlob(notesFreq, bpm) {
      const sampleRate = 22050;
      const noteDuration = (60 / bpm) * 0.75; // quarter note length in sec
      const noteSamples = Math.floor(sampleRate * noteDuration);
      const totalSamples = noteSamples * notesFreq.length;
      
      const buffer = new ArrayBuffer(44 + totalSamples * 2);
      const view = new DataView(buffer);

      // RIFF header
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + totalSamples * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true); // 16-bit
      writeString(view, 36, 'data');
      view.setUint32(40, totalSamples * 2, true);

      // Synthesize sine wave sequence
      let offset = 44;
      notesFreq.forEach(freq => {
        for (let i = 0; i < noteSamples; i++) {
          const t = i / sampleRate;
          const sample = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 3); // decay envelope
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }
      });

      return new Blob([buffer], { type: 'audio/wav' });
    }

    // Helper: Create functional Standard MIDI (.mid) Blob
    function createMidiFileBlob(midiNotes, bpm) {
      const header = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60];
      const trackHeader = [0x4d, 0x54, 0x72, 0x6b];
      
      let trackData = [];
      
      // Set Tempo meta event
      const microsecondsPerQuarter = Math.round(60000000 / bpm);
      trackData.push(0x00, 0xFF, 0x51, 0x03, 
        (microsecondsPerQuarter >> 16) & 0xFF,
        (microsecondsPerQuarter >> 8) & 0xFF,
        microsecondsPerQuarter & 0xFF
      );

      midiNotes.forEach(note => {
        // Note On (channel 0, note, velocity 90)
        trackData.push(0x00, 0x90, note, 0x5A);
        // Delta time duration (96 ticks = 1 quarter note), Note Off
        trackData.push(0x60, 0x80, note, 0x00);
      });

      // End of Track
      trackData.push(0x00, 0xFF, 0x2F, 0x00);

      const trackLength = trackData.length;
      const trackLenBytes = [
        (trackLength >> 24) & 0xFF,
        (trackLength >> 16) & 0xFF,
        (trackLength >> 8) & 0xFF,
        trackLength & 0xFF
      ];

      const fullMidi = new Uint8Array([...header, ...trackHeader, ...trackLenBytes, ...trackData]);
      return new Blob([fullMidi], { type: 'audio/midi' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }
  </script>
</body>
</html>
