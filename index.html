<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonix</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen bg-slate-950 font-sans text-slate-100 flex flex-col justify-center items-center p-6">

  <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl space-y-6">
    <header class="text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-indigo-400">Harmonix</h1>
      <p class="text-sm text-slate-400 mt-1">Audio Sample Engine</p>
    </header>

    <section class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Preset Sample</label>
        <select id="sampleSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="synth-pad">Synth Pad (Generated C4)</option>
          <option value="808-kick">808 Kick (Generated)</option>
          <option value="hi-hat">Hi-Hat (Generated)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Or Upload Custom File</label>
        <input type="file" id="audioFileInput" accept="audio/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"/>
      </div>
    </section>

    <section class="pt-2">
      <button id="playBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-semibold rounded-lg shadow-lg transition-all flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
        </svg>
        Play Sample
      </button>
    </section>

    <footer class="text-center pt-2 border-t border-slate-800">
      <span id="statusText" class="text-xs text-emerald-400 font-mono">Status: Ready</span>
    </footer>
  </main>

  <script>
    // Web Audio API Initialization
    let audioCtx = null;
    let currentBuffer = null;

    const playBtn = document.getElementById('playBtn');
    const sampleSelect = document.getElementById('sampleSelect');
    const fileInput = document.getElementById('audioFileInput');
    const statusText = document.getElementById('statusText');

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Generate Synthetic Audio Samples to bypass external URL/CORS issues
    function createSyntheticBuffer(type) {
      initAudioContext();
      const sampleRate = audioCtx.sampleRate;
      let duration = 1.0;
      let buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      let data = buffer.getChannelData(0);

      if (type === 'synth-pad') {
        for (let i = 0; i < buffer.length; i++) {
          let t = i / sampleRate;
          data[i] = Math.sin(2 * Math.PI * 261.63 * t) * Math.exp(-1.5 * t); // C4 Note Decay
        }
      } else if (type === '808-kick') {
        for (let i = 0; i < buffer.length; i++) {
          let t = i / sampleRate;
          let freq = 150 * Math.exp(-20 * t);
          data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-5 * t);
        }
      } else if (type === 'hi-hat') {
        for (let i = 0; i < buffer.length; i++) {
          let t = i / sampleRate;
          data[i] = (Math.random() * 2 - 1) * Math.exp(-30 * t);
        }
      }
      return buffer;
    }

    // Play currently loaded audio buffer
    function playBuffer(buffer) {
      if (!buffer) return;
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    // Handle File Upload
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      initAudioContext();
      statusText.textContent = "Status: Loading File...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        currentBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        statusText.textContent = `Status: Loaded "${file.name}"`;
      } catch (err) {
        statusText.textContent = "Status: Error Loading File";
        console.error("Audio Decode Error:", err);
      }
    });

    // Play Button Click Event
    playBtn.addEventListener('click', () => {
      initAudioContext();

      if (fileInput.files.length > 0 && currentBuffer) {
        playBuffer(currentBuffer);
      } else {
        const selectedType = sampleSelect.value;
        const synthBuffer = createSyntheticBuffer(selectedType);
        playBuffer(synthBuffer);
        statusText.textContent = `Status: Playing ${selectedType}`;
      }
    });
  </script>
</body>
</html>
