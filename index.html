<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harmony Studio v3.2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; overflow: hidden; font-size: 13px; }
.app { display: grid; grid-template-columns: 240px 1fr 300px; grid-template-rows: 40px 1fr 80px; height: 100vh; gap: 1px; background: #30363d; }
.header { grid-column: 1/-1; background: #161b22; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #30363d; }
.logo { font-weight: 700; background: linear-gradient(135deg, #58a6ff, #bc8cff, #f778ba); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.btn:hover { background: #1c2333; color: #e6edf3; }
.left-panel { background: #161b22; padding: 10px; overflow-y: auto; grid-row: 2/-1; font-size: 12px; }
.left-panel label { display: flex; align-items: center; gap: 4px; padding: 2px 0; cursor: pointer; color: #8b949e; font-size: 11px; }
.left-panel select, .left-panel input[type="file"] { width: 100%; padding: 3px 6px; background: #1c2333; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; font-size: 11px; margin-bottom: 4px; }
.center-panel { background: #161b22; position: relative; overflow: hidden; grid-row: 2/-1; }
.right-panel { background: #161b22; padding: 10px; overflow-y: auto; grid-row: 2/-1; }
.bottom-panel { background: #161b22; grid-column: 2/-1; display: flex; align-items: center; padding: 0 12px; gap: 8px; border-top: 1px solid #30363d; }
canvas { width: 100%; height: 100%; }
.action-btn { width: 100%; padding: 5px; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; margin-top: 3px; }
.action-btn.primary { background: #58a6ff; color: white; }
.action-btn.success { background: #3fb950; color: white; }
.action-btn:disabled { opacity: 0.4; cursor: default; }
#fileStatus { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-top: 4px; min-height: 20px; }
#fileStatus.loaded { background: rgba(63,185,80,0.15); color: #3fb950; }
#fileStatus.missing { background: rgba(248,81,73,0.15); color: #f85149; }
.issue-item { padding: 4px 6px; background: #1c2333; border-radius: 4px; margin-bottom: 3px; border-left: 3px solid #d29922; font-size: 10px; cursor: pointer; }
.issue-item.critical { border-left-color: #f85149; }
.issue-item .title { color: #e6edf3; font-weight: 500; }
.issue-item .desc { color: #8b949e; font-size: 9px; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #161b22; border-radius: 8px; padding: 20px; max-width: 500px; width: 90%; border: 1px solid #30363d; max-height: 80vh; overflow-y: auto; }
.section-title { font-size: 9px; text-transform: uppercase; color: #484f58; margin-bottom: 4px; margin-top: 8px; font-weight: 600; }
.section-title:first-child { margin-top: 0; }
#statusText { font-size: 11px; color: #8b949e; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">🎵 Harmony Studio v3.2</div>
    <div>
      <button class="btn" onclick="doAnalyze()">🔍</button>
      <button class="btn" onclick="doExport()">💾</button>
      <button class="btn" onclick="doHelp()">📖</button>
    </div>
  </header>

  <aside class="left-panel">
    <div class="section-title">Import</div>
    <div style="border:2px dashed #30363d;border-radius:4px;padding:8px;text-align:center;cursor:pointer;background:#1c2333;margin-bottom:4px;" id="dropZone">
      🎵 Drop MIDI or click
    </div>
    <input type="file" id="fileInput" accept=".mid,.midi" style="display:none">
    <div id="fileStatus" class="missing">No file loaded</div>

    <div class="section-title">Key</div>
    <select id="keySelect">
      <option value="C">C</option><option value="G">G</option><option value="D">D</option><option value="A">A</option>
      <option value="E">E</option><option value="B">B</option><option value="F#">F#</option><option value="C#">C#</option>
      <option value="F">F</option><option value="Bb">Bb</option><option value="Eb">Eb</option><option value="Ab">Ab</option>
      <option value="Am">Am</option><option value="Em">Em</option><option value="Bm">Bm</option><option value="F#m">F#m</option>
      <option value="C#m">C#m</option><option value="G#m">G#m</option><option value="Dm">Dm</option><option value="Gm">Gm</option>
      <option value="Cm">Cm</option><option value="Fm" selected>Fm</option>
    </select>
    <div style="font-size:9px;color:#484f58;">Detected: <span id="detKey">—</span> <span id="detConf">—</span></div>

    <div class="section-title">Mode</div>
    <select id="modeSelect">
      <option value="1">1 – Third Above</option>
      <option value="2">2 – Third Below</option>
      <option value="3">3 – Sixths</option>
      <option value="4">4 – Extensions</option>
      <option value="5">5 – Smooth Pad</option>
      <option value="6">6 – Pop</option>
      <option value="7" selected>7 – Classical</option>
      <option value="8">8 – Cinematic</option>
    </select>

    <div class="section-title">Range / Voices</div>
    <select id="rangeSelect">
      <option value="mid">Mid (48-72)</option>
      <option value="low">Low (36-60)</option>
      <option value="high">High (60-84)</option>
      <option value="pad">Pad (48-84)</option>
    </select>
    <select id="voicesSelect">
      <option value="1">1 voice</option>
      <option value="2" selected>2 voices</option>
      <option value="3">3 voices</option>
    </select>
    <select id="leapSelect">
      <option value="5">Max leap: 5</option>
      <option value="7" selected>Max leap: 7</option>
      <option value="12">Max leap: 12</option>
      <option value="99">Unlimited</option>
    </select>
    <select id="chromaticSelect">
      <option value="strict" selected>Strict diatonic</option>
      <option value="chord">Allow chord tones</option>
      <option value="passing">Allow passing</option>
    </select>

    <button class="action-btn primary" id="genBtn" onclick="doGenerate()" disabled>🎶 Generate Harmony</button>

    <div class="section-title">Restore</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;">
      <label><input type="checkbox" id="chkDup" checked> Dupes</label>
      <label><input type="checkbox" id="chkHang" checked> Hanging</label>
      <label><input type="checkbox" id="chkOver" checked> Overlaps</label>
      <label><input type="checkbox" id="chkGhost" checked> Ghosts</label>
    </div>
    <button class="action-btn success" id="restBtn" onclick="doRestore()" disabled>🧹 Clean & Restore</button>
    <div id="restInfo" style="font-size:9px;color:#484f58;margin-top:2px;"></div>
  </aside>

  <main class="center-panel">
    <canvas id="pianoCanvas"></canvas>
  </main>

  <aside class="right-panel">
    <div class="section-title">Analysis</div>
    <div id="analysisInfo" style="font-size:10px;color:#8b949e;margin-bottom:8px;">
      <div>Score: <span id="scoreDisplay">—</span></div>
      <div>Issues: <span id="issueDisplay">0</span></div>
    </div>
    <div id="issueContainer"></div>
    <div style="margin-top:8px;">
      <div class="section-title">Info</div>
      <div id="harmInfo" style="font-size:10px;color:#8b949e;line-height:1.6;">
        <div>Key: <span id="infoKey">Fm</span></div>
        <div>Chords: <span id="infoChords">—</span></div>
        <div>Types: <span id="infoTypes">—</span></div>
      </div>
    </div>
    <div style="margin-top:8px;">
      <button class="action-btn primary" id="analBtn" onclick="doAnalyze()" disabled>🔍 Analyze</button>
      <button class="action-btn warning" id="resetBtn" onclick="doReset()" disabled>↩️ Reset</button>
    </div>
  </aside>

  <footer class="bottom-panel">
    <span id="statusText">Ready — Load a MIDI file (F minor test file suggested)</span>
    <div>
      <button class="btn" onclick="doPlay()">▶</button>
      <button class="btn" onclick="doStop()">⏹</button>
    </div>
  </footer>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle" style="margin-bottom:8px;">Info</h3>
    <p id="modalBody" style="color:#8b949e;font-size:12px;line-height:1.5;white-space:pre-wrap;"></p>
    <div style="text-align:right;margin-top:12px;">
      <button class="action-btn primary" onclick="closeModal()" style="width:auto;padding:4px 16px;">OK</button>
    </div>
  </div>
</div>

<script>
// ================================================================
// Harmony Studio v3.2 — Complete working implementation
// ================================================================

// Global state — simple object
var g = {
  notes: [], original: [], tracks: [], trackNames: [],
  tempoMap: [{tick:0,tempo:500000}], timeSigs: [], keySigs: [],
  ppq: 480, tempo: 120, key: 'Fm', keyConf: 0,
  isMod: false, undo: [], redo: [],
  harmIssues: [], noteIdCounter: 0,
  audioCtx: null, oscs: [], playing: false,
  diagnostics: [],
  classification: {},
};

// ---- Constants ----
var NN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var MODES = { major: [0,2,4,5,7,9,11], minor: [0,2,3,5,7,8,10] };
var CHORDS = {
  M:[0,4,7], m:[0,3,7], dim:[0,3,6], aug:[0,4,8],
  '7':[0,4,7,10], maj7:[0,4,7,11], m7:[0,3,7,10],
  sus2:[0,2,7], sus4:[0,5,7],
};
var RANGES = { low:{min:36,max:60}, mid:{min:48,max:72}, high:{min:60,max:84}, pad:{min:48,max:84} };
var MODE_NAMES = {1:'Third Above',2:'Third Below',3:'Sixths',4:'Extensions',5:'Smooth Pad',6:'Pop',7:'Classical',8:'Cinematic'};

function mod(n,m) { return ((n%m)+m)%m; }
function pc(mn) { return mod(mn,12); }
function oct(mn) { return Math.floor(mn/12); }

function getScale(key) {
  var r = NN.indexOf(key.replace(/[^A-G#b]/g,''));
  if (r<0) r=0;
  var m = key.endsWith('m') ? 'minor' : 'major';
  return MODES[m].map(function(i) { return mod(r+i,12); });
}

function findDeg(pc, sc) {
  var i = sc.indexOf(pc);
  if (i>=0) return i;
  var bd=99, bi=0;
  for(var j=0;j<sc.length;j++) { var d=Math.min(Math.abs(sc[j]-pc),12-Math.abs(sc[j]-pc)); if(d<bd){bd=d;bi=j;} }
  return bi;
}

function diatonicTarget(srcPc, sc, off) {
  if(off===0) return srcPc;
  return sc[mod(findDeg(srcPc,sc)+off, sc.length)];
}

// ---- MIDI Parse ----
function readVL(data, pos) {
  var v=0;
  for(var c=0;c<4;c++) {
    if(pos>=data.length) return {v:0,pos:e};
    var b=data[pos++];
    v=(v<<7)|(b&0x7F);
    if(!(b&0x80)) return {v:v,pos:pos};
  }
  return {v:0,pos:pos};
}

function writeVL(value) {
  value = Math.max(0, Math.min(0x0FFFFFFF, Math.floor(Number(value)||0)));
  var b = []; b.push(value & 0x7F);
  while ((value>>=7) > 0) b.push((value & 0x7F) | 0x80);
  b.reverse(); return b;
}

function parseMIDI(buf) {
  var d = new Uint8Array(buf);
  var v = new DataView(buf);
  if (String.fromCharCode(d[0],d[1],d[2],d[3])!=='MThd') throw new Error('Not MIDI');
  var fmt = v.getUint16(8), nt = v.getUint16(10), ppq = v.getUint16(12);
  var pos = 14, tracks = [], tm = [{tick:0,tempo:500000}], ts = [], ks = [], allNotes = [], names = [];
  g.noteIdCounter = 0;

  for(var t=0;t<nt;t++) {
    if (String.fromCharCode(d[pos],d[pos+1],d[pos+2],d[pos+3])!=='MTrk') throw new Error('Bad track '+t);
    var len = v.getUint32(pos+4);
    var tr = parseTrack(d.slice(pos+8,pos+8+len), ppq, t, tm, ts, ks);
    tracks.push(tr);
    for(var ni=0;ni<tr.notes.length;ni++) allNotes.push(tr.notes[ni]);
    if (tr.name) names[t]=tr.name;
    pos += 8+len;
  }
  if(!tm.some(function(x){return x.tick===0;})) tm.unshift({tick:0,tempo:500000});
  tm.sort(function(a,b){return a.tick-b.tick;});
  allNotes.sort(function(a,b){return a.start-b.start||a.note-b.note;});

  // Detect key
  var w = new Array(12).fill(0);
  for(var i=0;i<allNotes.length;i++) { var n=allNotes[i]; if(n.note>=0&&n.note<128&&n.channel!==9) w[pc(n.note)] += (n.duration||240)+(n.velocity||64); }
  var total = w.reduce(function(a,b){return a+b;},0);
  var dk = 'C', dconf = 0;
  if(total>0) {
    var keys=[];
    for(var t2=0;t2<12;t2++) {
      var maj = MODES.major.map(function(i){return mod(t2+i,12);});
      var min = MODES.minor.map(function(i){return mod(t2+i,12);});
      var ms=0, mis=0;
      for(var p=0;p<12;p++) { if(maj.includes(p)) ms+=w[p]; if(min.includes(p)) mis+=w[p]; }
      keys.push({k:t2,s:ms,n:NN[t2]}); keys.push({k:t2,s:mis,n:NN[t2]+'m'});
    }
    keys.sort(function(a,b){return b.s-a.s;});
    dk = keys[0].n; dconf = Math.min(1, keys[0].s/total);
  }
  if(ks.length) { var ksn=ks[0]; var fn=['C','G','D','A','E','B','F#','C#','F','Bb','Eb','Ab']; dk=fn[(ksn.key+7)%12]||'C'; if(ksn.scale) dk+='m'; }

  return {fmt:fmt,nt:nt,ppq:ppq,tracks:tracks,notes:allNotes,tm:tm,ts:ts,ks:ks,names:names,key:dk,conf:dconf};
}

function parseTrack(data, ppq, idx, tm, ts, ks) {
  var pos=0, tick=0, rs=null, notes=[], events=[], active={}, name='';
  while(pos<data.length) {
    var r = readVL(data,pos); pos=r.pos; tick+=r.v;
    if(pos>=data.length) break;
    var st = data[pos++];
    if(st<0x80) { if(rs===null)continue; pos--; st=rs; } else rs=st;
    if(st===0xFF) {
      if(pos>=data.length)break;
      var mt=data[pos++], r2=readVL(data,pos); pos=r2.pos; var len=r2.v, md=data.slice(pos,pos+len); pos+=len;
      if(mt===0x03) { name=new TextDecoder().decode(md); events.push({tick:tick,type:'name',text:name}); }
      else if(mt===0x51&&len>=3) { tm.push({tick:tick,tempo:(md[0]<<16)|(md[1]<<8)|md[2]}); }
      else if(mt===0x58&&len>=4) { ts.push({tick:tick,num:md[0],den:Math.pow(2,md[1])}); }
      else if(mt===0x59&&len>=2) { var kk=md[0]>127?md[0]-256:md[0]; ks.push({tick:tick,key:kk,scale:md[1]}); }
      continue;
    }
    if(st===0xF0||st===0xF7) { r2=readVL(data,pos); pos=r2.pos+r2.v; continue; }
    if(pos+1>=data.length)break;
    var type=st>>4, ch=st&0x0F;
    if(type===0x8||type===0x9) {
      var note=data[pos++], vel=data[pos++], key=idx+'|'+ch+'|'+note;
      if(type===0x9&&vel>0) {
        if(!active[key]) active[key]=[];
        active[key].push({start:tick,velocity:vel,channel:ch,track:idx,noteId:g.noteIdCounter++});
      } else {
        if(active[key]&&active[key].length) {
          var a=active[key].shift();
          notes.push({id:a.noteId,track:idx,channel:ch,note:note,start:a.start,end:Math.max(a.start+1,tick),duration:Math.max(1,tick-a.start),velocity:a.velocity});
        }
      }
    } else {
      if(type===0xC||type===0xD) { if(pos>=data.length)break; events.push({tick:tick,type:'ch',st:st,data:[data[pos++]]}); }
      else { if(pos+1>=data.length)break; events.push({tick:tick,type:'ch',st:st,data:[data[pos++],data[pos++]]}); }
    }
  }
  // Handing hanging
  for(var k in active) {
    var stack=active[k]; while(stack.length) { var a=stack.shift(); notes.push({id:a.noteId,track:idx,channel:a.channel,note:parseInt(k.split('|')[2],10),start:a.start,end:Math.max(a.start+1,tick),duration:Math.max(1,tick-a.start),velocity:a.velocity,hanging:true}); }
  }
  return {notes:notes,events:events,name:name};
}

// ---- MIDI Write ----
function writeMIDI(notes, ppq, tm, ts, ks, names, srcTracks) {
  var p = Math.max(1, Math.min(0x7FFF, Math.round(ppq||480)));
  var byTr = {};
  for(var i=0;i<notes.length;i++){var n=notes[i];var t=Math.max(0,Math.round(n.track||0));if(!byTr[t])byTr[t]=[];byTr[t].push(n);}
  var tc = Math.max(srcTracks.length, notes.length?Math.max.apply(null,notes.map(function(n){return Math.max(0,Math.round(n.track||0));}))+1:1, 1);
  var chunks = [];

  // Conductor track
  var condEv = [];
  for(var i=0;i<tm.length;i++) condEv.push({tick:Math.max(0,Math.round(tm[i].tick||0)),type:'tempo',tempo:tm[i].tempo});
  for(var i=0;i<ts.length;i++) condEv.push({tick:Math.max(0,Math.round(ts[i].tick||0)),type:'ts',num:ts[i].num,den:ts[i].den});
  for(var i=0;i<ks.length;i++) condEv.push({tick:Math.max(0,Math.round(ks[i].tick||0)),type:'ks',key:ks[i].key,scale:ks[i].scale});
  if(!condEv.some(function(x){return x.type==='tempo'&&x.tick===0;})) condEv.push({tick:0,type:'tempo',tempo:500000});
  chunks.push(writeTrack(condEv));

  for(var t=0;t<tc;t++) {
    var ev = [];
    ev.push({tick:0,type:'name',text:names[t]||'Track'+(t+1)});
    if(srcTracks[t]) for(var i=0;i<srcTracks[t].events.length;i++){var e=srcTracks[t].events[i];if(e.type==='ch')ev.push({tick:e.tick,type:'ch',st:e.st,data:e.data.slice()});}
    var tn = byTr[t]||[];
    for(var i=0;i<tn.length;i++){var n2=tn[i];var s=Math.max(0,Math.round(n2.start||0));var dur=Math.max(1,Math.round(n2.duration||((n2.end||s+1)-s)||1));var en=Math.max(s+1,Math.round(n2.end||(s+dur)));var ch2=Math.max(0,Math.min(15,Math.round(n2.channel||0)));var nt2=Math.max(0,Math.min(127,Math.round(n2.note||0)));var vel=Math.max(1,Math.min(127,Math.round(n2.velocity||1)));ev.push({tick:s,type:'on',note:nt2,velocity:vel,channel:ch2});ev.push({tick:en,type:'off',note:nt2,velocity:0,channel:ch2});}
    chunks.push(writeTrack(ev));
  }

  var hdr = writeHeader(1, chunks.length, p);
  var total = hdr.length; for(var i=0;i<chunks.length;i++) total+=chunks[i].length;
  var r = new Uint8Array(total); var off=0;
  r.set(hdr,off); off+=hdr.length;
  for(var i=0;i<chunks.length;i++){r.set(chunks[i],off);off+=chunks[i].length;}
  return r;
}

function writeHeader(fmt, nt, ppq) {
  var d=new Uint8Array(14), v=new DataView(d.buffer);
  d.set([0x4D,0x54,0x68,0x64],0); v.setUint32(4,6); v.setUint16(8,fmt); v.setUint16(10,nt); v.setUint16(12,ppq);
  return d;
}

function writeTrack(events) {
  var b=[], tick=0;
  var sorted = events.slice().sort(function(a,b){return a.tick-b.tick||((a.type==='off'?0:1)-(b.type==='off'?0:1));});
  for(var i=0;i<sorted.length;i++){var e=sorted[i];var t=Math.max(tick,Math.round(e.tick||0));Array.prototype.push.apply(b,writeVL(t-tick));
    if(e.type==='tempo'){var tmp=Math.max(1,Math.min(0xFFFFFF,Math.round(e.tempo||500000)));b.push(0xFF,0x51,0x03,(tmp>>16)&0xFF,(tmp>>8)&0xFF,tmp&0xFF);}
    else if(e.type==='ts'){var de=Math.max(1,e.den||4);b.push(0xFF,0x58,0x04,Math.max(1,e.num||4)&0xFF,Math.round(Math.log2(de))&0xFF,24,8);}
    else if(e.type==='ks'){b.push(0xFF,0x59,0x02,(Math.max(-7,Math.min(7,Math.round(e.key||0)))+256)&0xFF,e.scale?1:0);}
    else if(e.type==='name'){var txt=new TextEncoder().encode(e.text||'');b.push(0xFF,0x03);Array.prototype.push.apply(b,writeVL(txt.length));Array.prototype.push.apply(b,txt);}
    else if(e.type==='ch'){b.push(e.st&0xFF);for(var j=0;j<e.data.length;j++)b.push(e.data[j]&0x7F);}
    else if(e.type==='on'){b.push(0x90|(e.channel&0x0F),e.note&0x7F,e.velocity&0x7F);}
    else if(e.type==='off'){b.push(0x80|(e.channel&0x0F),e.note&0x7F,0);}
    tick=t;
  }
  b.push(0x00,0xFF,0x2F,0x00);
  var r=new Uint8Array(8+b.length);
  r.set([0x4D,0x54,0x72,0x6B],0); new DataView(r.buffer).setUint32(4,b.length);
  r.set(b,8); return r;
}

// ---- Classify Track ----
function classifyTrack(notes, ti) {
  var tn = [];
  for(var i=0;i<notes.length;i++) if(notes[i].track===ti||notes[i].track===undefined) tn.push(notes[i]);
  if(!tn.length) return 'unknown';
  for(var i=0;i<tn.length;i++) if(tn[i].channel===9) return 'drums';
  var avgP = tn.length / (new Set(tn.map(function(n){return n.note;})).size || 1);
  var starts = tn.map(function(n){return n.start;});
  var uniq = new Set(starts);
  var simR = uniq.size ? (tn.length-uniq.size)/tn.length : 0;
  var durs = tn.map(function(n){return n.duration||240;}).sort(function(a,b){return a-b;});
  var med = durs[Math.floor(durs.length/2)];
  var pitches = tn.map(function(n){return n.note;});
  var avgPitch = pitches.reduce(function(a,b){return a+b;},0)/pitches.length;
  if(avgPitch<55&&(Math.max.apply(null,pitches)-Math.min.apply(null,pitches))<30) return 'bass';
  if(avgP>=2&&simR>0.4&&med>480&&tn.length<200) return 'pad';
  if(avgP>=2&&simR>0.3&&med>240) return 'chord';
  if(avgP<1.5) return 'melody';
  return 'chord';
}

// ---- Chord Detection ----
function detectChord(pcs) {
  if(pcs.length<2) return null;
  var uniq = [...new Set(pcs)].sort(function(a,b){return a-b;});
  var bestS=0, bestR=null;
  for(var type in CHORDS) {
    var tpl = CHORDS[type];
    for(var root=0;root<12;root++) {
      var cp = tpl.map(function(i){return mod(root+i,12);});
      var m=0; for(var j=0;j<uniq.length;j++) if(cp.includes(uniq[j])) m++;
      var miss = tpl.length - tpl.filter(function(i){return uniq.includes(mod(root+i,12));}).length;
      var score = m - miss*0.5;
      if(score>bestS){bestS=score;bestR={root:root,type:type,pcs:cp,name:NN[root]+type,score:score};}
    }
  }
  if(bestR&&uniq.length>=3&&uniq[0]!==bestR.root) {
    var bi = bestR.pcs.indexOf(uniq[0]);
    bestR.inv = bi===3?'3rd':bi===5?'5th':'inv';
  } else if(bestR) bestR.inv = 'root';
  return bestR;
}

// ---- Voice Leading Scoring ----
function scoreCand(cand, prev, srcNotes, range, maxLeap, sc, chord) {
  var cost = 0;
  if(prev!==null) { var l=Math.abs(cand-prev); if(l>maxLeap)cost+=100; if(l>12)cost+=50; if(l>7)cost+=20; else cost+=l*0.5; }
  var cp = pc(cand);
  for(var i=0;i<srcNotes.length;i++){var iv=Math.min(Math.abs(cp-pc(srcNotes[i].note)),12-Math.abs(cp-pc(srcNotes[i].note)));if(iv===1)cost+=80;else if(iv===11)cost+=70;else if(iv===0)cost+=3;}
  if(cand<range.min)cost+=30;if(cand>range.max)cost+=30;
  if(!sc.includes(cp))cost+=50;
  if(chord&&chord.pcs&&!chord.pcs.includes(cp))cost+=10;
  if(prev===cand)cost+=8;
  return cost;
}

function pickBest(cands, prev, srcNotes, range, maxLeap, sc, chord) {
  if(!cands.length) return null;
  var best=cands[0], bestS=scoreCand(best,prev,srcNotes,range,maxLeap,sc,chord);
  for(var i=1;i<cands.length;i++){var s=scoreCand(cands[i],prev,srcNotes,range,maxLeap,sc,chord);if(s<bestS){best=cands[i];bestS=s;}}
  return best;
}

function genCands(tp, minM, maxM) {
  var r=[];
  for(var o=Math.max(0,Math.floor(minM/12));o<=Math.min(11,Math.floor(maxM/12));o++){var n=o*12+tp;if(n>=minM&&n<=maxM)r.push(n);}
  return r.sort(function(a,b){return a-b;});
}

function groupSimul(notes, tol) {
  var s=notes.slice().sort(function(a,b){return a.start-b.start;});
  var g=[], cur=[], ct=-1;
  for(var i=0;i<s.length;i++){var n=s[i];if(!cur.length){cur.push(n);ct=n.start;}else if(Math.abs(n.start-ct)<=tol){cur.push(n);}else{if(cur.length>=2)g.push(cur.slice());cur=[n];ct=n.start;}}
  if(cur.length>=2)g.push(cur);
  return g;
}

// ---- Generate Harmony ----
function generateHarmony() {
  if(!g.notes.length){showModal('No Data','Load a MIDI file first');return;}
  var key = document.getElementById('keySelect').value;
  var mode = parseInt(document.getElementById('modeSelect').value);
  var rn = document.getElementById('rangeSelect').value;
  var range = RANGES[rn]||RANGES.mid;
  var maxLeap = parseInt(document.getElementById('leapSelect').value);
  var voices = parseInt(document.getElementById('voicesSelect').value);
  var chrom = document.getElementById('chromaticSelect').value;
  var sc = getScale(key);

  var mel = [];
  for(var i=0;i<g.notes.length;i++) if(g.notes[i].channel!==9) mel.push(g.notes[i]);
  if(!mel.length){showModal('No Melody','No melodic notes found');return;}

  // Backup
  pushUndo();

  // Classify
  var cls = {};
  for(var i=0;i<mel.length;i++) cls[mel[i].track||0] = classifyTrack(mel, mel[i].track||0);
  var counts = {}; for(var k in cls) counts[cls[k]]=(counts[cls[k]]||0)+1;
  var effType = 'melody', maxC=0;
  for(var k2 in counts) if(counts[k2]>maxC){maxC=counts[k2];effType=k2;}
  var isPad = effType==='pad'||effType==='chord';

  var gen = [];
  var diag = [];
  var chordGrps = isPad ? groupSimul(mel,10) : [];

  for(var v=0;v<voices;v++) {
    var vOff = v===0?0:(v===1?-12:12);
    var vr = {min:range.min+vOff, max:range.max+vOff};
    var prev = null;
    var vn = [];

    if(isPad && chordGrps.length) {
      for(var gi=0;gi<chordGrps.length;gi++) {
        var grp = chordGrps[gi];
        var st = grp[0].start;
        var et = st;
        for(var i=0;i<grp.length;i++) et = Math.max(et, grp[i].end||grp[i].start+240);
        var pcs = [...new Set(grp.map(function(n){return pc(n.note);}))].sort(function(a,b){return a-b;});
        var chord = detectChord(pcs);

        var tps = [];
        if(mode===4) {
          for(var ext of [2,5,9,11]) { var ep=mod(chord.root+ext,12); if(!chord.pcs.includes(ep)&&sc.includes(ep)){tps.push(ep);break;} }
          if(!tps.length) tps.push(mod(chord.root+10,12));
        } else if(mode===5) {
          for(var t of [2,5,7,9,10]) { var tp=mod(chord.root+t,12); if(!chord.pcs.includes(tp)&&sc.includes(tp)){tps.push(tp);if(tps.length>=voices)break;} }
          if(!tps.length) tps.push(mod(chord.root+7,12));
        } else if(mode===8) {
          for(var iv of [0,7,14,2]) { var tp=mod(chord.root+iv,12); if(!chord.pcs.includes(tp)){tps.push(tp);if(tps.length>=voices)break;} }
          if(!tps.length) tps.push(mod(chord.root+7,12));
        } else {
          var dir = mode===2?-1:1; var intv = mode===3?5:2; var off = (intv*dir)+v*dir;
          tps.push(diatonicTarget(pc(grp[Math.floor(grp.length/2)].note), sc, off));
        }
        tps = [...new Set(tps)];
        for(var ti=0;ti<tps.length;ti++) {
          if(vn.length>=voices) break;
          var tp=tps[ti]; var cands=genCands(tp,vr.min,vr.max);
          var best = pickBest(cands, prev, grp, vr, maxLeap, sc, chord);
          if(best!==null) {
            var vel = Math.max(1, Math.min(127, Math.round(grp.reduce(function(s,n){return s+n.velocity;},0)/grp.length-8)));
            vn.push({id:g.noteIdCounter++, track:g.tracks.length, channel:2, note:best, start:st, end:et, duration:et-st, velocity:vel, generated:true});
            prev = best;
          }
        }
        if(!vn.length) {
          var fb = diatonicTarget(pc(grp[0].note), sc, 2);
          var cands2 = genCands(fb, vr.min, vr.max);
          var best2 = pickBest(cands2,prev,grp,vr,maxLeap,sc,chord);
          if(best2!==null) vn.push({id:g.noteIdCounter++, track:g.tracks.length, channel:2, note:best2, start:st, end:et, duration:et-st, velocity:Math.max(1,grp[0].velocity-8), generated:true});
        }
      }
    } else {
      for(var mi=0;mi<mel.length;mi++) {
        var src = mel[mi];
        var srcPc = pc(src.note);
        var step=2, dir=1;
        if(mode===2){step=2;dir=-1;} else if(mode===3){step=5;dir=1;} else if(mode===8){step=4;dir=1;}
        var tp = diatonicTarget(srcPc, sc, step*dir);
        var cands = genCands(tp, vr.min, vr.max);
        if(!cands.length) cands=genCands(tp,0,127).filter(function(c){return c>=24&&c<=108;});
        if(prev!==null) cands=cands.filter(function(c){return Math.abs(c-prev)<=maxLeap;});
        if(chrom==='strict') cands=cands.filter(function(c){return sc.includes(pc(c));});
        var best = pickBest(cands, prev, [src], vr, maxLeap, sc, null);
        var d = {sourceNote:src.note, sourceName:NN[srcPc], sourceTick:src.start, sourceDuration:src.duration, key:key, scaleDegree:findDeg(srcPc,sc), mode:mode, targetPc:tp, selectedMidi:best, candidates:cands.map(function(c){return{note:c,name:NN[pc(c)]+oct(c)};})};
        if(best!==null) {
          var vel = Math.max(1, Math.min(127, Math.round(src.velocity-8)));
          vn.push({id:g.noteIdCounter++, track:g.tracks.length, channel:2, note:best, start:src.start, end:src.end, duration:src.duration, velocity:vel, generated:true});
          prev = best;
        }
        diag.push(d);
      }
    }
    for(var i=0;i<vn.length;i++) gen.push(vn[i]);
  }

  g.diagnostics = diag;
  var ti = g.tracks.length;
  g.tracks.push({notes:gen, events:[], name:'Harmony: '+(MODE_NAMES[mode]||'Gen')});
  g.trackNames[ti] = 'Harmony: '+(MODE_NAMES[mode]||'Gen');
  for(var i=0;i<gen.length;i++) g.notes.push(gen[i]);
  g.isMod = true;

  document.getElementById('statusText').textContent = '✅ Generated '+gen.length+' harmony notes ('+(MODE_NAMES[mode]||'')+')';
  renderPR();
  setTimeout(doAnalyze,100);
}

// ---- Analyze ----
function doAnalyze() {
  if(!g.notes.length){showModal('No Data','Load a MIDI file first');return;}
  var key = document.getElementById('keySelect').value; g.key=key;
  var sc = getScale(key);
  var filtered = [];
  for(var i=0;i<g.notes.length;i++) if(g.notes[i].channel!==9) filtered.push(g.notes[i]);
  if(!filtered.length){return;}
  var issues = [];

  // Clashes
  var s = filtered.slice().sort(function(a,b){return a.start-b.start;});
  for(var i=0;i<s.length;i++) for(var j=i+1;j<s.length;j++) { var a=s[i],b=s[j]; if(a.start<b.end&&b.start<a.end){ var iv=Math.abs(a.note-b.note)%12; if([1,6,11].includes(iv)){ issues.push({type:'clash',sev:iv===6?'critical':'warning',title:'Clash: '+a.note+' vs '+b.note,desc:'Interval: '+iv+' semitones'}); } } }

  // Chords
  var cgs = groupSimul(filtered, 240);
  var chords = [];
  for(var gi=0;gi<cgs.length;gi++) { var g2=cgs[gi]; if(g2.length<2)continue; var pcs=[...new Set(g2.map(function(n){return pc(n.note);}))].sort(function(a,b){return a-b;}); var ch=detectChord(pcs); if(ch) chords.push({time:g2[0].start,root:ch.root,name:NN[ch.root]+ch.type,inv:ch.inv||'root'}); }

  // Classification
  var cls={};
  for(var i=0;i<g.notes.length;i++) cls[g.notes[i].track||0]=classifyTrack(filtered,g.notes[i].track||0);
  g.classification = cls;
  var typeStr = ''; for(var k in cls) typeStr += 'T'+k+':'+cls[k]+' ';
  document.getElementById('infoTypes').textContent = typeStr||'—';

  g.harmIssues = issues;
  var score = Math.max(0, Math.min(100, 100-issues.length*10));
  document.getElementById('scoreDisplay').textContent = score+'%';
  document.getElementById('issueDisplay').textContent = issues.length;
  document.getElementById('infoKey').textContent = key;
  document.getElementById('infoChords').textContent = chords.length ? chords.map(function(c){return c.name+'('+c.inv+')';}).join(' → ') : 'None';

  var cont = document.getElementById('issueContainer');
  if(!issues.length) cont.innerHTML = '<div style="color:#3fb950;font-size:11px;">✅ No issues</div>';
  else cont.innerHTML = issues.map(function(x,i){return '<div class="issue-item '+(x.sev==='critical'?'critical':'')+'" onclick="showModal(\'Issue\',\''+x.title+'\\n'+x.desc+'\')"><div class="title">'+x.title+'</div><div class="desc">'+x.desc+'</div></div>';}).join('');

  document.getElementById('statusText').textContent = '✅ Analyzed: '+issues.length+' issues';
  renderPR();
}

// ---- UI ----
function renderPR() {
  var canvas = document.getElementById('pianoCanvas');
  var rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  var ctx = canvas.getContext('2d');
  var w=canvas.width, h=canvas.height;
  var notes = g.notes;
  if(!notes.length){ctx.fillStyle='#1c2333';ctx.fillRect(0,0,w,h);ctx.fillStyle='#484f58';ctx.textAlign='center';ctx.fillText('No notes',w/2,h/2);return;}
  var minN=Math.max(21,Math.min.apply(null,notes.map(function(n){return n.note;}))-2);
  var maxN=Math.min(108,Math.max.apply(null,notes.map(function(n){return n.note;}))+2);
  var nR = maxN-minN+1;
  var maxT = Math.max.apply(null,notes.map(function(n){return n.end||n.start+1000;}))+1000;
  var pad={t:16,b:24,l:28,r:8};
  var pW = w-pad.l-pad.r, pH = h-pad.t-pad.b;
  var nH = Math.min(pH/nR, 10);
  var tS = pW/maxT;

  ctx.fillStyle='#1c2333'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#30363d'; ctx.lineWidth=0.5;
  for(var i=0;i<=nR;i++){ctx.beginPath();ctx.moveTo(pad.l,pad.t+i*nH);ctx.lineTo(w-pad.r,pad.t+i*nH);ctx.stroke();}
  for(var t=0;t<maxT;t+=480){var x=pad.l+t*tS;if(x>w-pad.r)break;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,h-pad.b);ctx.stroke();}

  var cols = ['136,192,255','188,140,255','247,120,186','255,161,105','126,231,193','255,214,102','99,255,181'];
  for(var i=0;i<notes.length;i++){var n=notes[i];var x=pad.l+n.start*tS;var ex=pad.l+(n.end||n.start+1000)*tS;var y=pad.t+(maxN-n.note)*nH;var w2=Math.max(ex-x,1);var h2=Math.max(nH-1,1);var col;if(n.generated)col='rgba(99,255,181,0.6)';else{var om=g.original.filter(function(o){return o.id===n.id;})[0];if(om&&om.note!==n.note)col='rgba(63,185,80,0.7)';else{var v=(n.velocity||64)/127;col='rgba('+cols[(n.channel||0)%cols.length]+','+(0.3+v*0.5)+')';}}ctx.fillStyle=col;ctx.fillRect(x,y,w2,h2);}
  ctx.fillStyle='#484f58'; ctx.font='7px sans-serif'; ctx.textAlign='right';
  for(var ni=minN;ni<=maxN;ni+=5) ctx.fillText(ni,pad.l-4,pad.t+(maxN-ni)*nH+nH/2+2);
  ctx.textAlign='left'; ctx.fillText(g.notes.length+' notes | Key: '+g.key,pad.l,h-4);
}

function loadMIDI(file) {
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var res = parseMIDI(e.target.result);
      g.notes = res.notes.map(function(n){return JSON.parse(JSON.stringify(n));});
      g.original = res.notes.map(function(n){return JSON.parse(JSON.stringify(n));});
      g.tracks = res.tracks.map(function(t){return{notes:t.notes.slice(),events:t.events.slice(),name:t.name};});
      g.trackNames = res.names.slice();
      g.ppq = res.ppq; g.tempoMap = res.tm; g.timeSigs = res.ts; g.keySigs = res.ks;
      g.tempo = res.tm.length ? 60000000/res.tm[0].tempo : 120;
      g.key = res.key||'Fm'; g.keyConf = res.conf||0;

      var ks = document.getElementById('keySelect');
      var matched=false;
      for(var i=0;i<ks.options.length;i++){if(ks.options[i].value===g.key){ks.selectedIndex=i;matched=true;break;}}
      if(!matched){var cl=g.key.replace(/[^A-Ga-g#bm]/g,'').toLowerCase();for(var i=0;i<ks.options.length;i++){if(ks.options[i].value.toLowerCase()===cl){ks.selectedIndex=i;break;}}}

      document.getElementById('fileStatus').textContent = '✅ '+file.name;
      document.getElementById('fileStatus').className = 'file-status loaded';
      document.getElementById('detKey').textContent = g.key;
      document.getElementById('detConf').textContent = g.keyConf ? (g.keyConf*100).toFixed(0)+'%' : '—';
      document.getElementById('analBtn').disabled = false;
      document.getElementById('genBtn').disabled = false;
      document.getElementById('restBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
      document.getElementById('statusText').textContent = '✅ Loaded: '+file.name+' ('+g.notes.length+' notes, key: '+g.key+')';
      renderPR();
      doAnalyze();
    } catch(err) { showModal('Error','Failed to load MIDI: '+err.message); console.error(err); }
  };
  r.readAsArrayBuffer(file);
}

function doGenerate() { generateHarmony(); }
function doAnalyze() { doAnalyze(); }
function doExport() {
  if(!g.notes.length){showModal('No Data','Nothing to export');return;}
  try {
    var d = writeMIDI(g.notes, g.ppq, g.tempoMap, g.timeSigs, g.keySigs, g.trackNames, g.tracks);
    var b = new Blob([d], {type:'audio/midi'});
    var u = URL.createObjectURL(b);
    var a = document.createElement('a'); a.href=u; a.download='harmony_'+Date.now()+'.mid'; a.click();
    URL.revokeObjectURL(u);
    document.getElementById('statusText').textContent = '✅ Exported MIDI';
  } catch(e) { showModal('Export Error',e.message); }
}
function doHelp() { showModal('Help','Harmony Studio v3.2\n\nLoad a MIDI file (drag/drop or click).\nDefault key: F minor.\nPick a harmony mode and click Generate.\n\nKeyboard:\nSpace=Play, A=Analyze, E=Export\nU=Undo, Y=Redo, Z=Reset'); }

function doPlay() {
  if(!g.notes.length) return;
  if(!g.audioCtx) g.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  var ctx = g.audioCtx;
  var sorted = g.notes.slice().sort(function(a,b){return a.start-b.start;});
  var ft = sorted[0]?.start||0;
  var ppq = g.ppq||480, tempo = g.tempo||120, tps = ppq/(60/tempo);
  doStop();
  for(var i=0;i<g.notes.length;i++){var n=g.notes[i];var time=(n.start-ft)/tps;var dur=Math.max(0.05,(n.duration||240)/tps);var vel=Math.min((n.velocity||64)/255,0.4);var st=ctx.currentTime+time;var et=st+dur;try{var osc=ctx.createOscillator();var gain=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(440*Math.pow(2,(n.note-69)/12),st);gain.gain.setValueAtTime(0,st);gain.gain.linearRampToValueAtTime(vel*0.08,st+0.005);gain.gain.exponentialRampToValueAtTime(0.001,et);osc.connect(gain);gain.connect(ctx.destination);osc.start(st);osc.stop(et+0.01);g.oscs.push(osc);}catch(e){}}
  g.playing=true;
}
function doStop() { for(var i=0;i<g.oscs.length;i++){try{g.oscs[i].stop();g.oscs[i].disconnect();}catch(e){}} g.oscs=[]; g.playing=false; }

function pushUndo() { g.undo.push({notes:JSON.parse(JSON.stringify(g.notes)),tracks:JSON.parse(JSON.stringify(g.tracks)),names:g.trackNames.slice()}); g.redo=[]; }
function doReset() { if(!g.isMod)return; if(!confirm('Reset all changes?'))return; pushUndo(); g.notes=JSON.parse(JSON.stringify(g.original)); g.isMod=false; renderPR(); doAnalyze(); document.getElementById('statusText').textContent='↩️ Reset to original'; }

function doRestore() {
  if(!g.notes.length) return;
  pushUndo();
  var notes = g.notes.map(function(n){return JSON.parse(JSON.stringify(n));});
  var chk = function(id){return document.getElementById(id).checked;};
  if(chk('chkDup')){var seen=new Set(); notes=notes.filter(function(n){var k=n.track+'|'+n.channel+'|'+n.note+'|'+Math.round(n.start);if(seen.has(k))return false;seen.add(k);return true;});}
  if(chk('chkHang')){notes=notes.map(function(n){if(n.hanging){n.end=n.start+240;n.duration=240;n.hanging=false;}return n;});}
  if(chk('chkOver')){notes=notes.map(function(n){n.end=Math.max(n.start+1,n.end||n.start+240);n.duration=n.end-n.start;return n;});}
  g.notes=notes; g.isMod=true;
  document.getElementById('restInfo').textContent='Cleaned: '+notes.length+' notes';
  renderPR(); document.getElementById('statusText').textContent='✅ Restored'; setTimeout(doAnalyze,100);
}

function showModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').textContent=b;document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  switch(e.key.toLowerCase()){
    case ' ': e.preventDefault(); if(g.playing)doStop(); else doPlay(); break;
    case 'a': doAnalyze(); break;
    case 'e': doExport(); break;
    case 'z': doReset(); break;
    case 'u': if(g.undo.length){g.redo.push({notes:JSON.parse(JSON.stringify(g.notes)),tracks:JSON.parse(JSON.stringify(g.tracks)),names:g.trackNames.slice()});var p=g.undo.pop();g.notes=p.notes;g.tracks=p.tracks;g.trackNames=p.names;renderPR();doAnalyze();} break;
    case 'y': if(g.redo.length){g.undo.push({notes:JSON.parse(JSON.stringify(g.notes)),tracks:JSON.parse(JSON.stringify(g.tracks)),names:g.trackNames.slice()});var n=g.redo.pop();g.notes=n.notes;g.tracks=n.tracks;g.trackNames=n.names;renderPR();doAnalyze();} break;
    case 'h': doHelp(); break;
    case 'escape': closeModal(); break;
  }
});

// Init
document.getElementById('statusText').textContent = '🎵 Harmony Studio v3.2 — Load a MIDI file (F minor test recommended)';
renderPR();
console.log('Harmony Studio v3.2 ready — Press H for help');
