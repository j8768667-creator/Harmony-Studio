<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lyric-to-MIDI Melody Generator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, textarea, input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .results {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .results.active {
      display: flex;
    }

    .midi-visualizer {
      height: 120px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 1rem;
    }

    /* Simulated Piano Roll Notes */
    .note-bar {
      width: 8%;
      background: linear-gradient(180deg, #818cf8 0%, var(--accent) 100%);
      border-radius: 4px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .audio-player-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    audio {
      width: 100%;
      border-radius: 6px;
    }

    .download-group {
      display: flex;
      gap: 1rem;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background-color: #10b98120;
      color: #10b981;
      border: 1px solid #10b98140;
      width: fit-content;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Lyric-to-MIDI Generator</h1>
      <p>On-Device AI Pitch & Rhythm Synthesis Engine</p>
    </header>

    <div class="card">
      <div class="status-badge">⚡ Lightweight Model Loaded (On-Device)</div>
      
      <div class="controls-grid">
        <div class="form-group">
          <label for="scale">Target Scale</label>
          <select id="scale">
            <option value="auto">Auto-Detect Mood</option>
            <option value="c-major">C Major</option>
            <option value="a-minor">A Minor</option>
            <option value="f-major">F Major</option>
            <option value="e-minor">E Minor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo">Tempo (BPM)</label>
          <input type="number" id="tempo" value="120" min="60" max="200">
        </div>

        <div class="form-group">
          <label for="vocal-style">Guide Vocal Model</label>
          <select id="vocal-style">
            <option value="pop-female">Pop Female (Fast Synth)</option>
            <option value="indie-male">Indie Male (Fast Synth)</option>
            <option value="robot-neutral">Neutral Synth</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="lyrics">Enter Lyrics</label>
        <textarea id="lyrics" placeholder="Type your lyrics here...&#10;e.g., Walking through the rain late at night"></textarea>
      </div>

      <button class="btn" id="generate-btn" onclick="generateMelody()">Generate MIDI & Audio</button>
    </div>

    <div class="card results" id="results-card">
      <h3>Generated Melody Output</h3>
      
      <div class="form-group">
        <label>Piano Roll Preview</label>
        <div class="midi-visualizer">
          <div class="note-bar" style="height: 40%;"></div>
          <div class="note-bar" style="height: 60%;"></div>
          <div class="note-bar" style="height: 35%;"></div>
          <div class="note-bar" style="height: 80%;"></div>
          <div class="note-bar" style="height: 65%;"></div>
          <div class="note-bar" style="height: 50%;"></div>
          <div class="note-bar" style="height: 75%;"></div>
        </div>
      </div>

      <div class="audio-player-container">
        <label>Synthesized Guide Vocal (.WAV)</label>
        <audio controls id="audio-player">
          <source src="" type="audio/wav">
          Your browser does not support the audio element.
        </audio>
      </div>

      <div class="download-group">
        <button class="btn btn-secondary" onclick="alert('Exporting .MID file...')">Download MIDI (.mid)</button>
        <button class="btn btn-secondary" onclick="alert('Exporting .WAV file...')">Download Vocal (.wav)</button>
      </div>
    </div>
  </div>

  <script>
    function generateMelody() {
      const lyrics = document.getElementById('lyrics').value.trim();
      const btn = document.getElementById('generate-btn');
      const resultsCard = document.getElementById('results-card');

      if (!lyrics) {
        alert('Please enter some lyrics first.');
        return;
      }

      // Indicate loading state
      btn.textContent = 'Processing Prosody & Generating...';
      btn.disabled = true;

      // Simulate fast local processing delay
      setTimeout(() => {
        btn.textContent = 'Generate MIDI & Audio';
        btn.disabled = false;
        resultsCard.classList.add('active');
        
        // Scroll smoothly to results
        resultsCard.scrollIntoView({ behavior: 'smooth' });
      }, 1000);
    }
  </script>
</body>
</html>
